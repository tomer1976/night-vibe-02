name: Mobile Maestro Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-maestro-android.yml"
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-maestro-android.yml"

jobs:
  maestro-android-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Expo prebuild (Android)
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK with bundled JS
        working-directory: mobile/android
        run: ./gradlew assembleDebug -PbundleInDebug=true

      - name: Resolve Android app id
        run: |
          APP_ID=$(grep -oP 'package="\K[^"]+' mobile/android/app/src/main/AndroidManifest.xml | head -n 1)
          if [ -z "$APP_ID" ]; then
            echo "Failed to resolve app id from AndroidManifest.xml"
            exit 1
          fi
          echo "MAESTRO_APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "Resolved MAESTRO_APP_ID=$APP_ID"

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro smoke flows on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          script: |
            adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro --version
            maestro test mobile/.maestro/smoke-welcome-login.yaml
            maestro test mobile/.maestro/smoke-login-nearby.yaml

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts
          path: |
            ~/.maestro/tests
            mobile/android/app/build/reports
          if-no-files-found: ignore
